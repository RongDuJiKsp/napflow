name: Build Docker Images on Tag

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, server, proxy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: ${{ vars.IMAGE_NAME }}-${{ matrix.app }}:latest
          outputs: type=docker,dest=/tmp/${{ matrix.app }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: /tmp/${{ matrix.app }}.tar
          retention-days: 1

  push:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, server, proxy]

    steps:
      - name: Extract tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/${{ matrix.app }}.tar

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.app }} image
        run: |
          docker tag ${{ vars.IMAGE_NAME }}-${{ matrix.app }}:latest ${{ vars.IMAGE_NAME }}-${{ matrix.app }}:${{ env.TAG }}
          docker push ${{ vars.IMAGE_NAME }}-${{ matrix.app }}:latest
          docker push ${{ vars.IMAGE_NAME }}-${{ matrix.app }}:${{ env.TAG }}
