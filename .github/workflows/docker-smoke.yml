name: Docker Build Smoke on Push

on:
  push:
    branches:
      - '**'

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (smoke)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false

      - name: Build server image (smoke)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: false

      - name: Build proxy image (smoke)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/proxy/Dockerfile
          push: false
