services:
  mysql:
    image: mysql:8.4
    container_name: napflow-mysql
    init: true
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-napflow_db}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    command: ["mysqld", "--port=${MYSQL_PORT:-3306}"]
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_BIND_PORT:-3306}:${MYSQL_PORT:-3306}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - napflow_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -P$${MYSQL_PORT:-3306} -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: napflow-server:latest
    pull_policy: never
    container_name: napflow-server
    init: true
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HOST_NAME: 0.0.0.0
      PORT: ${SERVER_PORT:-8848}
      MYSQL_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PWD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_HOSTPORT: mysql:${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-napflow_db}
      ACC_ROOT_EMAIL: ${ACC_ROOT_EMAIL:-root@napflow.com}
      ACC_ROOT_NICKNAME: ${ACC_ROOT_NICKNAME:-rootUser}
      ACC_ROOT_PASSWORD: ${ACC_ROOT_PASSWORD:-root}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "${SERVER_BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8848}:${SERVER_PORT:-8848}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - napflow_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: napflow-web:latest
    pull_policy: never
    container_name: napflow-web
    init: true
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      PORT: ${WEB_PORT:-3000}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - napflow_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: napflow-proxy:latest
    pull_policy: never
    container_name: napflow-proxy
    init: true
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      - web
      - server
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: ${WEBUI_PORT:-80}
      WEB_TARGET: http://web:${WEB_PORT:-3000}
      API_TARGET: http://server:${SERVER_PORT:-8848}
    ports:
      - "${WEBUI_BIND_HOST:-0.0.0.0}:${WEBUI_PORT:-80}:${WEBUI_PORT:-80}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - napflow_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:

networks:
  napflow_net:
    driver: bridge
